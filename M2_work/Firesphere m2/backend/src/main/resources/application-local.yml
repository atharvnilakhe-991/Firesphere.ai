spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:firesphere}?currentSchema=firesphere
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: firesphere
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.firesphere.backend: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173}

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_AUTH_TOKEN:live-integration-token}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

